; Grading Card Bench - Photo Rig Controller firmware
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor -b 115200
;
; Pick the env matching your board. Both share src/.

[platformio]
default_envs = esp32s3

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.7.0
    bblanchon/ArduinoJson@^7.1.0
build_flags =
    -D SERIAL_RX_BUFFER_SIZE=2048

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D RIG_BOARD_NAME=\"ESP32-S3\"

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -D RIG_BOARD_NAME=\"ESP32\"

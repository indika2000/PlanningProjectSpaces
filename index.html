<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Idea Tester - Text Adventure Designer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <h1>Text Adventure Designer</h1>
      <span class="tagline">Design. Play. Instantly.</span>
    </div>
    <div class="header-actions">
      <button id="btn-new" title="New Game">New</button>
      <button id="btn-import" title="Import JSON" class="hide-mobile">Import</button>
      <button id="btn-export" title="Export JSON" class="hide-mobile">Export</button>
      <button id="btn-play" class="btn-primary" title="Launch game in preview">Play</button>
    </div>
  </header>

  <!-- Mobile tab bar: switch between Editor and Preview -->
  <nav class="mobile-tabs" id="mobile-tabs">
    <button class="mobile-tab active" data-tab="editor">Edit</button>
    <button class="mobile-tab" data-tab="preview">Preview</button>
  </nav>

  <main class="split-pane">
    <!-- LEFT: Editor Panel -->
    <section class="editor-panel" id="editor-panel">
      <div class="panel-header">
        <h2>Scenes</h2>
        <button id="btn-add-scene" title="Add Scene">+ Scene</button>
      </div>

      <div class="scene-list" id="scene-list">
        <!-- Scene cards rendered here -->
      </div>

      <div class="scene-editor" id="scene-editor">
        <div class="editor-placeholder" id="editor-placeholder">
          <p>Select a scene or click <strong>+ Scene</strong> to start designing your adventure.</p>
        </div>
        <form id="scene-form" class="hidden">
          <div class="form-group">
            <label for="scene-id">Scene ID</label>
            <input type="text" id="scene-id" placeholder="e.g. forest_clearing" />
          </div>
          <div class="form-group">
            <label for="scene-title">Title</label>
            <input type="text" id="scene-title" placeholder="e.g. The Forest Clearing" />
          </div>
          <div class="form-group">
            <label for="scene-text">Story Text</label>
            <textarea id="scene-text" rows="6" placeholder="Describe what the player sees..."></textarea>
          </div>
          <div class="form-group">
            <label>Choices</label>
            <div id="choices-container"></div>
            <button type="button" id="btn-add-choice" class="btn-small">+ Add Choice</button>
          </div>
          <div class="form-actions">
            <button type="button" id="btn-save-scene" class="btn-primary">Save Scene</button>
            <button type="button" id="btn-delete-scene" class="btn-danger">Delete</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Resizer -->
    <div class="resizer" id="resizer"></div>

    <!-- RIGHT: Preview Panel (the "artifact" screen) -->
    <section class="preview-panel" id="preview-panel">
      <div class="panel-header">
        <h2>Live Preview</h2>
        <div class="preview-controls">
          <button id="btn-restart" title="Restart game">Restart</button>
          <button id="btn-fullscreen" title="Fullscreen preview">Fullscreen</button>
        </div>
      </div>
      <div class="preview-frame-wrapper">
        <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin" title="Game Preview"></iframe>
        <div class="preview-placeholder" id="preview-placeholder">
          <div class="preview-placeholder-content">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <p>Click <strong>Play</strong> to test your adventure</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <input type="file" id="file-import" accept=".json" class="hidden" />

  <script src="js/engine.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/chapter1.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
